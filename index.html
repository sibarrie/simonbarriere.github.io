<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Accès protégé</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 100px;
}
input {
  padding: 10px;
  font-size: 16px;
}
button {
  padding: 10px;
}
</style>
</head>

<body>

<h2>Accès privé</h2>
<p>Veuillez entrer le mot de passe</p>

<input type="password" id="pwd">
<button onclick="check()">Entrer</button>

<script>
function check() {
  var password = document.getElementById("pwd").value;

  if(password === "0000") {
    window.location.href = "cv.html";
  } else {
    alert("Mot de passe incorrect");
  }
}
</script>


  
</body>
</html>
