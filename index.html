<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5; /* couleur d'origine conservée */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
            color: #555;
        }

        .buttons a {
            text-decoration: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #007BFF; /* ta couleur d'origine */
            color: white;
            transition: 0.2s;
            font-size: 16px;
        }

        .buttons a:hover {
            background-color: #0056b3; /* hover d'origine */
        }

        .flag {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bienvenue</h1>
    <p>Choisissez la langue pour accéder à mon CV</p>

    <div class="buttons">
        <a href="cvfr.html">
            <span class="flag">🇫🇷</span> Français
        </a>
        <a href="cv.html">
            <span class="flag">🇬🇧</span> English
        </a>
    </div>
</div>

</body>
</html>
