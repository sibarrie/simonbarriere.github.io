<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès protégé</title>

  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(96, 165, 250, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .profile-img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      border-color: rgba(96, 165, 250, 0.7);
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
    }

    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 20px rgba(96, 165, 250, 0.25);
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }

      h2 {
        font-size: 1.7rem;
      }

      .profile-img {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>

<body>
  <div class="login-card">
<img src="cache-image.jpg" alt="" width="250">

    <h2>Accès privé</h2>
    <p>Veuillez entrer le mot de passe pour accéder au site</p>

    <div class="input-group">
      <input type="password" id="pwd" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') check()">
      <button onclick="check()">Entrer</button>
    </div>

    <div class="hint">
      Espace personnel protégé
    </div>
  </div>

  <script>
    function check() {
      var password = document.getElementById("pwd").value;

      if (password === "0000") {
        window.location.href = "cv.html";
      } else {
        alert("Mot de passe incorrect");
      }
    }
  </script>
</body>
</html>
