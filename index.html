<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue</title>

    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-light: #1f2937;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --accent: #60a5fa;
            --border: rgba(255,255,255,0.08);
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.6);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        p {
            margin-bottom: 30px;
            color: var(--muted);
        }

        .buttons a {
            text-decoration: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 999px;

            display: inline-flex;
            align-items: center;
            gap: 10px;

            background: rgba(96,165,250,0.15);
            border: 1px solid rgba(96,165,250,0.4);
            color: var(--text);

            transition: 0.2s;
            font-size: 16px;
        }

        .buttons a:hover {
            background: rgba(96,165,250,0.3);
        }

        .flag {
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Bienvenue</h1>
    <p>Choisissez la langue pour accéder à mon CV</p>

    <div class="buttons">
        <a href="cvfr.html">
            <span class="flag">🇫🇷</span> Français
        </a>
        <a href="cveng.html">
            <span class="flag">🇬🇧</span> English
        </a>
    </div>
</div>

</body>
</html>
